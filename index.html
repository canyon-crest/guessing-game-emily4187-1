<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Number Guessing Game</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Dark mode toggle -->
    <input type="checkbox" id="toggle">
    <label for="toggle" class="toggle-label" aria-label="Toggle Dark Mode"></label>
    <h1>The Guessing Game</h1>
  <div id="container">
    <div id="sidebar">
      <h3>Stats</h3>
      <p id="wins">Total wins: --</p>
      <p id="avgScore">Average Score: --</p>
      <p id="fastest">Fastest Game: --</p>
      <p id="avgTime">Average Time: --</p>

      <h3>Leaderboard</h3>
      <ol>
        <li name="leaderboard">--</li>
        <li name="leaderboard">--</li>
        <li name="leaderboard">--</li>
      </ol>
    </div>
  <div id="main-content">
    <p id="date"></p>
    <p id="currentTime"></p>
    <p id="gameClock">Elapsed time: 0.00 seconds</p>

    <h3>Level: Select Difficulty</h3>
    <div id="levels">
    <input type="radio" name="level" id="e" value="3" checked> <label for="e">Easy</label>
    <input type="radio" name="level" id="m" value="10"><label for="m">Medium</label>
    <input type="radio" name="level" id="h" value="100"><label for="h">Hard</label>
    <input type="radio" name="level" id="o" value="1"><label for="o">Other</label>
    <input type="text" id="maxvalue" placeholder="Enter Max Value">
    </div>

    <button id="playBtn">Play</button>

    <h3 id="msg">Select a Level</h3>
    <input type="text" id="guess">
    <div id="buttonRow">
    <button id="guessBtn" disabled>Guess</button>
    <button id="giveUpBtn" disabled>Give Up</button>
    </div>
  </div>
  </div>
  </body>
</html>
